# Weekly off-site database backup — GO_LIVE §6.
#
# **Why this runs here and not on the app server.** Neon's Free plan keeps 6 hours of restore
# history, and that history lives inside the account it protects: a suspension or a deleted project
# takes it with it. So the second copy has to leave Neon, and the job that makes it has to run
# somewhere that is neither Neon nor a laptop — a weekly backup that depends on one machine being
# awake is not a backup. GitHub Actions also settles the practical blocker: `pg_dump` is a binary,
# the ubuntu runner ships it, and the machine this was developed on has neither it nor Docker.
#
# **It is deliberately independent of the app host.** Nothing here knows where the site is deployed,
# so choosing Render or Vercel later changes nothing about whether backups keep happening.
#
# **Five secrets** (Settings → Secrets and variables → Actions): DATABASE_URL, R2_ACCOUNT_ENDPOINT,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BACKUP_BUCKET. The R2 token is scoped to the backup
# bucket alone and can only write objects — if it leaks, what it buys is the ability to add files to
# a backup bucket, not to read the site or reach the database.
name: Database backup

on:
  schedule:
    # 02:17 UTC daily. Not on the hour: GitHub's scheduler queues heavily at :00 and delays there
    # run to tens of minutes, and a backup has no reason to compete for that slot.
    #
    # **Daily, not weekly, and the weekly first draft had no argument behind it — only caution
    # (changed 2026-08-09, asked "why not daily?" and there was no answer).** The interval IS the
    # worst-case data loss: a week of orders is a week nobody can reconstruct, and the whole point
    # of this file is that the database has no other copy. So the only question is what daily costs,
    # and it was measured rather than assumed, at the real dump size of 825 KB:
    #
    #   R2 storage      23.6 MB/month · 287 MB/year, against a 10 GB free tier — ~36 years
    #   R2 writes       30/month, against 1,000,000 free
    #   Actions minutes ~22/month (43s a run), against 2,000 free for a private repo
    #   Neon           one 20-second read a day
    #
    # Nothing here is close to a limit, so weekly was buying nothing and costing six days.
    #
    # **What daily does introduce is a bucket that grows forever**, which is the same shape this
    # project just spent a session fixing in the database. It is not urgent — the arithmetic above
    # is decades at the current size, and dumps compress with the data — but it is not self-solving
    # either, because the dump grows with the catalogue. The fix when it matters is an R2 lifecycle
    # rule (Cloudflare dashboard → the bucket → Object lifecycle rules → delete after N days), not
    # code here: expiry belongs to the store, and a deleting backup script is one bug away from
    # being the disaster it exists to prevent.
    - cron: '17 2 * * *'
  # So the first run — and every restore drill — is a button rather than a week of waiting.
  workflow_dispatch:

# Two backup runs at once would upload two near-identical dumps and prove nothing extra.
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # A dump of this database takes seconds; anything approaching this ceiling means something is
    # wrong, and a job that hangs until the default 6-hour limit reports nothing for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # `pg_dump` REFUSES to dump a server newer than itself — it aborts rather than writing a
      # partial file, which is the right behaviour and the reason this step is pinned.
      #
      # **The version is 18 because Neon runs 18.4, measured — not assumed (2026-08-09).** The first
      # run of this workflow failed with `server version: 18.4 … pg_dump version: 16.14`, which is
      # also how we learned that the project's own notes (and docker-compose.yml) still say 17: Neon
      # upgraded under us, as a managed service will. If this step ever fails that way again, the
      # error names both numbers — raise this one to match the server, never lower it.
      #
      # **And `PG_DUMP_PATH` points at the VERSIONED binary, not `/usr/bin/pg_dump`.** That was the
      # second half of the same failure: `/usr/bin/pg_dump` is a `postgresql-common` wrapper that
      # picks a cluster's version on its own and chose the runner's preinstalled 16 even after 18
      # was installed beside it. Installing the right client is not the same as running it.
      - name: Install postgresql-client-18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version

      # No `npm ci`: the script imports nothing outside node: builtins, on purpose. Installing the
      # whole dependency tree would put a broken lockfile between an incident and its backup.
      - name: Dump and upload
        env:
          # The exact binary, bypassing the wrapper — see the install step above.
          PG_DUMP_PATH: /usr/lib/postgresql/18/bin/pg_dump
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ENDPOINT: ${{ secrets.R2_ACCOUNT_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: node scripts/backup-db.mjs
