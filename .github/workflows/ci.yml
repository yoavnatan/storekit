# The blocking gate. Deliberately not in the pre-push hook: a check that stands between you and a
# push gets bypassed with --no-verify the first time it is inconvenient, and a check that can be
# bypassed is not a gate. Here it runs on GitHub, cannot be skipped, and costs you no local time.
#
# `npm run lint` compares against .eslint-baseline.json, so the pre-existing backlog never fails a
# build — only problems a change introduces. Shrink the backlog with `npm run lint:all`, then
# `npm run lint:prune` to drop the suppressions you cleared.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types first — a type error usually explains any lint or test failure after it.
      - name: Type check
        run: npx astro check

      - name: Lint (new problems only)
        run: npm run lint

      - name: Tests
        run: npm test

      # Catches what the others cannot: an .astro template that type-checks but fails to compile.
      - name: Build
        run: npm run build
